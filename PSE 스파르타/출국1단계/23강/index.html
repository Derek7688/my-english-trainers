<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PSE 스파르타 | Lesson 23</title>
<style>
:root{--ink:#17231e;--muted:#748078;--paper:#f5f5ef;--card:#fff;--green:#c8f169;--line:#e6e9df;--accent:#2c4939}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer;border:0}button:focus-visible{outline:3px solid #8bb63c;outline-offset:3px}
.wrap{width:min(100%,760px);margin:auto;padding:24px 18px 42px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}
.brand{font-size:12px;letter-spacing:.18em;font-weight:900;color:var(--accent)}.pill{border:1px solid #dce1d5;border-radius:999px;padding:8px 12px;color:var(--muted);font-size:11px;font-weight:800}
h1{font-size:clamp(30px,7vw,48px);line-height:1.08;letter-spacing:-.055em;margin:0;font-weight:950}.subtitle{color:var(--muted);font-size:14px;margin:12px 0 24px}
.setup,.study{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:clamp(20px,5vw,34px);box-shadow:0 14px 40px #293b2510}
.section-label{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--muted);margin-bottom:12px}
.segment{display:flex;gap:8px;background:#f0f2eb;padding:5px;border-radius:15px;margin-bottom:20px}.segment button{flex:1;padding:12px 8px;border-radius:11px;background:transparent;color:#69736a;font-size:13px;font-weight:800}.segment button.active{background:var(--accent);color:white;box-shadow:0 4px 10px #182b2020}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0;border-top:1px solid var(--line);font-size:14px;font-weight:750}.switch{background:#e7eae2;color:#69736a;border-radius:999px;padding:8px 13px;font-size:12px;font-weight:900;min-width:72px}.switch.on{background:var(--green);color:#26351c}
.primary{width:100%;background:var(--green);color:#20301a;border-radius:16px;padding:17px;font-size:16px;font-weight:950;margin-top:18px;box-shadow:0 7px 0 #a9d64e}.primary:active{transform:translateY(2px);box-shadow:0 5px 0 #a9d64e}
.study{display:none;padding:0;overflow:hidden}.study-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}.back{background:#f1f3ec;border-radius:12px;padding:10px 12px;font-size:12px;font-weight:850}.count{font-size:12px;font-weight:900;color:var(--muted);font-variant-numeric:tabular-nums}
.progress{height:12px;background:#eef0e9;position:relative;cursor:pointer;touch-action:none;padding:4px 0}
.progress-track{height:4px;background:#e5e9df;border-radius:99px;position:relative;margin:0 14px}
.bar{height:4px;background:#a5d642;width:0%;border-radius:99px;position:relative;transition:width .12s}
.bar::after{content:"";position:absolute;right:-6px;top:-4px;width:12px;height:12px;background:#2c4939;border:2px solid #fff;border-radius:50%;box-shadow:0 1px 4px #0002}
.progress-hit{position:absolute;inset:-10px -14px;cursor:ew-resize}
.progress-meta{display:flex;justify-content:space-between;padding:8px 20px 0;color:#8a9487;font-size:11px;font-weight:850;font-variant-numeric:tabular-nums}
.celebrate{position:fixed;inset:0;background:#17231ecc;z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.celebrate.show{display:flex}.celebrate-card{background:#fffdf7;width:min(100%,420px);border-radius:28px;padding:34px 25px;text-align:center;box-shadow:0 24px 90px #0004;animation:pop .28s ease-out}
.celebrate-icon{font-size:54px;margin-bottom:14px}.celebrate h2{font-size:29px;line-height:1.2;letter-spacing:-.04em;margin:0 0 12px;font-weight:950}.celebrate p{font-size:15px;line-height:1.7;color:#667064;margin:0 0 24px}
@keyframes pop{from{transform:translateY(12px) scale(.96);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.question{padding:clamp(26px,7vw,54px) clamp(20px,6vw,46px) 26px;text-align:center;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.num{font-size:11px;font-weight:950;color:#849083;letter-spacing:.13em;margin-bottom:24px}.kr{font-size:clamp(27px,6vw,40px);line-height:1.45;font-weight:900;letter-spacing:-.04em;word-break:keep-all}

.answer-slot{height:148px;min-height:148px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:12px 20px;border-top:1px dashed #dfe4d8;overflow:hidden}.answer{border-top:0;padding:0;text-align:center;display:block;visibility:hidden;opacity:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .15s}.answer.show{visibility:visible;opacity:1}
.answer{border-top:1px dashed #dfe4d8;padding:24px 20px 28px;text-align:center;display:none}.answer.show{display:block}.en{font-size:clamp(21px,5vw,29px);font-weight:900;line-height:1.45;word-break:keep-all;color:#2c4939}.answer-label{font-size:10px;letter-spacing:.12em;color:#98a195;font-weight:900;margin-bottom:8px}
.controls{display:grid;grid-template-columns:58px 1fr 58px;gap:8px;padding:0 18px 18px}.control{border-radius:15px;min-height:54px;font-weight:900}.secondary{background:#f0f2eb;color:#3e4b40}.main-action{background:var(--accent);color:white}.control:disabled{opacity:.3;cursor:default}
.footnote{text-align:center;color:#9aa196;font-size:11px;margin:18px 0 0}
@media(min-width:600px){.wrap{padding-top:34px}.question{min-height:340px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><div class="brand">PSE / SPARTA</div><div class="pill">40 SENTENCE DRILL</div></div>
  <h1>Could</h1>
  <p class="subtitle">COULD의 다양한 의미와 시제를 연습합니다. 한국어를 보고 영어로 말한 뒤 정답을 확인하세요.</p>
  <section class="setup" id="setup">
    <div class="section-label">DRILL SETTINGS</div>
    <div class="section-label">문제 출제 방식</div>
    <div class="segment"><button id="ordered" class="active" onclick="setOrder('ordered')">순서대로</button><button id="random" onclick="setOrder('random')">랜덤</button></div>
    <p style="font-size:13px;color:var(--muted);line-height:1.7;margin:0">수동태 문장을 한국어에서 영어로 바꾸어 말하는 연습을 합니다.</p>
    <button class="primary" onclick="start()">40문장 연습 시작 →</button>
  </section>
  <section class="study" id="study">
    <div class="study-head"><button class="back" onclick="goHome()">← 처음으로</button><div class="count" id="count">001 / 040</div></div>
    <div class="progress" id="progress" role="slider" aria-label="문제 진행 위치" aria-valuemin="1" aria-valuemax="40" aria-valuenow="1" tabindex="0">
      <div class="progress-track"><div class="bar" id="bar"></div><div class="progress-hit" id="progressHit"></div></div>
    </div>
    <div class="progress-meta"><span id="progressLabel">진행 1 / 40</span><span>막대를 움직여 문제 이동</span></div>
    <div class="question">
      <div class="num" id="num">SENTENCE 001</div>
      <div class="kr" id="kr"></div>
      
    </div>
    <div class="answer-slot"><div class="answer" id="answer"><div class="answer-label">MODEL ANSWER</div><div class="en" id="en"></div></div></div>
    <div class="controls" style="grid-template-columns:58px 1fr">
      <button class="control secondary" id="prev" onclick="move(-1)" aria-label="이전 문제">← 이전</button>
      <button class="control main-action" id="reveal" onclick="reveal()">정답 확인</button>
    </div>
  </section>
  <p class="footnote">PSE SPARTA · COULD DRILL</p>
</main>
<div class="celebrate" id="celebrate" role="dialog" aria-modal="true" aria-labelledby="celebrateTitle">
  <div class="celebrate-card">
    <div class="celebrate-icon">🎉🏆🎉</div>
    <h2 id="celebrateTitle">정말 수고했어요!</h2>
    <p id="celebrateMessage">40개 문장 연습을 모두 마쳤어요.<br>꾸준히 말한 만큼 영어가 쌓이고 있어요!</p>
    <button class="primary" onclick="closeCelebration()">처음으로 돌아가기</button>
  </div>
</div>
<script>
const items = [{"num":1,"kr":"걔(남자)는 완전 착해.","en":"He couldn’t be nicer."},{"num":2,"kr":"나 완전 바빴어.","en":"I couldn’t’ve been busier."},{"num":3,"kr":"걔네들 정말 열심히 일했어.","en":"They couldn’t’ve worked harder."},{"num":4,"kr":"네 말에 완전 동의해.","en":"I couldn’t agree with you more."},{"num":5,"kr":"걔(남자) 완전 많이 마시고 있어.","en":"He couldn’t be drinking more."},{"num":6,"kr":"걘(여자) 돈 엄청 많이 모았어.","en":"She couldn’t’ve saved more money."},{"num":7,"kr":"걘(여자) 이게 뭔지 알 수도 있어.","en":"She could know what this is."},{"num":8,"kr":"내가 걔(남자) 대해서 오해했던 걸 수도 있어.","en":"I could’ve been wrong about him."},{"num":9,"kr":"걔(남자) 삼성에서 일할 수도 있어.","en":"He could work for Google."},{"num":10,"kr":"걔네들 지금 여기 오는 길일 수도 있어.","en":"They could be on the way here now."},{"num":11,"kr":"분위기가 어색해질 수도 있어.","en":"Things could get awkward."},{"num":12,"kr":"걔네들이 지금 우리 얘기를 하고 있을수도 있어.","en":"They could be talking about us now."},{"num":13,"kr":"걔(남자) 오늘 밤에 외식하고 있을수도 있어.","en":"He could be eating out tonight."},{"num":14,"kr":"걔(여자)가 요즘 운전 연수를 받고 있을 수도 있어.","en":"She could be taking driving lessons these days."},{"num":15,"kr":"네가 나한테 거짓말을 하고 있는 걸 수도 있잖아.","en":"You could be lying to me."},{"num":16,"kr":"걔(여자)는 자고 있을 수도 있어.","en":"She could be sleeping."},{"num":17,"kr":"걔(남자)가 한국어 공부를 오랫동안 했을 수도 있어.","en":"He could’ve studied Korean for a long time."},{"num":18,"kr":"걔네들이 기분이 안 좋았던 걸수도 있어.","en":"They could’ve been in a bad mood."},{"num":19,"kr":"난 이미 출발했을 수도 있어.","en":"I could’ve already left."},{"num":20,"kr":"네가 졸업할 때쯤이면 나는 이미 결혼했을 수도 있어.","en":"I could’ve already gotten married by the time you graduate."},{"num":21,"kr":"3월쯤에는 눈이 이미 전부 녹았을 수도 있어.","en":"All of the snow could’ve already melted by March."},{"num":22,"kr":"네가 전화했을 때 걔(여자)가 뭔가 중요한 걸 하는 중이었을 수도 있어.","en":"She could’ve been doing something important when you called."},{"num":23,"kr":"걔네들은 그때 저녁을 먹고 있었을 수도 있어.","en":"They could’ve been having dinner at that time."},{"num":24,"kr":"걔(남자)가 딴 생각을 하고 있었을 수도 있어.","en":"He could’ve been thinking about something else."},{"num":25,"kr":"내가 여기서 너보다 더 오래 살았을 수도 있어.","en":"I could’ve been living here longer than you have."},{"num":26,"kr":"걔(남자)는 일 하느라 바빴을 수도 있어.","en":"He could’ve been busy working."},{"num":27,"kr":"걔(남자)가 이게 뭔지 알 리가 없어.","en":"He couldn’t know what this is."},{"num":28,"kr":"걘(남자) 이게 뭔지 모를 수도 있어.","en":"He could not know what this is."},{"num":29,"kr":"걔(여자)가 그 말을 했을리가 없어.","en":"She couldn’t’ve said that."},{"num":30,"kr":"걔(여자)가 그 말을 안 했을수도 있어.","en":"She could not’ve said that."},{"num":31,"kr":"걔네들이 지금 열심히 일하고 있을 리가 없어.","en":"They couldn’t be working hard now."},{"num":32,"kr":"네가 착각하는 걸 수도 있어.","en":"You could be mistaken."},{"num":33,"kr":"잠깐 낮잠 자고 나면 좀 더 나아질 수도 있어.","en":"You could feel better after a short nap."},{"num":34,"kr":"너 다리 좀 떨지 않아줄 수 있어?","en":"Could you not shake your leg?"},{"num":35,"kr":"옷 따뜻하게 입어. 감기 걸릴 수도 있어!","en":"Make sure to dress warmly. You could catch a cold!"},{"num":36,"kr":"어떻게 나한테 미리 말을 안 해줄 수가 있어?","en":"How could you not tell me in advance?"},{"num":37,"kr":"걔(여자)가 집중하고 있었을 리가 없지.","en":"She couldn’t’ve been paying attention."},{"num":38,"kr":"숙소에 수건들이 없을 수도 있어.","en":"The accommodations could not have towels."},{"num":39,"kr":"걔네들 아직 저녁 안 먹었을 수도 있어.","en":"They could not have had dinner yet."},{"num":40,"kr":"우리가 어제 갔던 식당에 네 캐리어를 놔두고 왔을수도 있어.","en":"You could’ve left your suitcase at the restaurant we went to yesterday."}];
let sequence=[], idx=0, order='ordered', revealed=false;
function setOrder(mode){order=mode;document.getElementById('ordered').classList.toggle('active',mode==='ordered');document.getElementById('random').classList.toggle('active',mode==='random')}
function start(){
 sequence=[...items];if(order==='random')for(let i=sequence.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[sequence[i],sequence[j]]=[sequence[j],sequence[i]]}
 idx=0;document.getElementById('setup').style.display='none';document.getElementById('study').style.display='block';render();
}
function render(){
 const x=sequence[idx];revealed=false;
 document.getElementById('count').textContent=String(idx+1).padStart(3,'0')+' / '+String(sequence.length).padStart(3,'0');
 document.getElementById('num').textContent='SENTENCE '+String(x.num).padStart(3,'0');
 document.getElementById('kr').textContent=x.kr;
 document.getElementById('en').textContent=x.en;
 document.getElementById('answer').classList.remove('show');
 document.getElementById('reveal').textContent='정답 확인';
 document.getElementById('prev').disabled=idx===0;
 document.getElementById('bar').style.width=(sequence.length<=1?100:idx/(sequence.length-1)*100)+'%';
 document.getElementById('progressLabel').textContent=`진행 ${idx+1} / ${sequence.length}`;
 document.getElementById('progress').setAttribute('aria-valuemax',sequence.length);
 document.getElementById('progress').setAttribute('aria-valuenow',idx+1);
}
function reveal(){
 if(!revealed){
   revealed=true;
   document.getElementById('answer').classList.add('show');
   document.getElementById('reveal').textContent=idx===sequence.length-1?'연습 완료 🎉':'다음 문제 →';
 }else{
   if(idx<sequence.length-1){idx++;render();}
   else{showCelebration();}
 }
}
function move(step){if(idx+step<0||idx+step>=sequence.length)return;idx+=step;render()}
function goHome(){document.getElementById('celebrate').classList.remove('show');document.getElementById('study').style.display='none';document.getElementById('setup').style.display='block'}
function goToProgress(clientX){
 const track=document.querySelector('.progress-track');
 const rect=track.getBoundingClientRect();
 const ratio=Math.max(0,Math.min(1,(clientX-rect.left)/rect.width));
 const target=Math.round(ratio*(sequence.length-1));
 if(target!==idx){idx=target;render();}
}
const progressHit=document.getElementById('progressHit');
let draggingProgress=false;
progressHit.addEventListener('pointerdown',e=>{draggingProgress=true;progressHit.setPointerCapture(e.pointerId);goToProgress(e.clientX)});
progressHit.addEventListener('pointermove',e=>{if(draggingProgress)goToProgress(e.clientX)});
progressHit.addEventListener('pointerup',()=>{draggingProgress=false});
progressHit.addEventListener('pointercancel',()=>{draggingProgress=false});
document.getElementById('progress').addEventListener('keydown',e=>{
 if(!sequence.length)return;
 if(e.key==='ArrowRight'){e.preventDefault();idx=Math.min(sequence.length-1,idx+1);render()}
 if(e.key==='ArrowLeft'){e.preventDefault();idx=Math.max(0,idx-1);render()}
 if(e.key==='Home'){e.preventDefault();idx=0;render()}
 if(e.key==='End'){e.preventDefault();idx=sequence.length-1;render()}
});
function showCelebration(){
 document.getElementById('celebrateMessage').innerHTML=`${sequence.length}개 문장 연습을 모두 마쳤어요.<br>끝까지 해낸 자신을 칭찬해 주세요!`;
 document.getElementById('celebrate').classList.add('show');
}
function closeCelebration(){
 document.getElementById('celebrate').classList.remove('show');
 goHome();
}
document.addEventListener('keydown',e=>{if(document.getElementById('study').style.display==='block'){if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key===' '){e.preventDefault();reveal()}}});
</script>
</body>
</html>
