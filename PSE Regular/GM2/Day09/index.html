<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GM2 사다리 - Day 09 자료</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;900&display=swap');
        body { 
            font-family: 'Pretendard', sans-serif; 
            touch-action: manipulation; 
        }
        .auto-active { 
            background-color: #f97316 !important; 
            color: white !important; 
            border-color: #f97316 !important; 
        }
        .card-container { 
            min-height: 430px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
        }
        .banner-inner { transition: all 0.5s ease; }
        #progress-container { cursor: pointer; touch-action: none; }
        #prev-item-box { transition: all 0.5s ease; min-height: 48px; }
        .mode-btn-active { 
            background-color: #0f172a !important; 
            color: white !important; 
            border-color: #0f172a !important; 
        }
        
        /* ⏱ 자동 게이지 바 */
        #timer-gauge-bar {
            transition: width 50ms linear;
        }

        /* 🔤 자연스러운 줄바꿈 타이포그래피 규칙 */
        .natural-wrap {
            word-break: keep-all;         /* 한국어 어절 단위 보존 */
            overflow-wrap: break-word;    /* 영어 단어 단위 줄바꿈 */
            text-wrap: balance;          /* 균형 잡힌 문장 줄바꿈 */
            line-height: 1.55;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-start p-4">

    <!-- 배너 템플릿 -->
    <template id="banner-template">
        <div class="promo-banner bg-white border border-blue-50 p-4 rounded-[2.2rem] mb-6 cursor-pointer shadow-lg transition-all active:scale-95 w-full max-w-sm mx-auto" 
             onclick="window.open('https://www.pse-learning.co.kr/course/course_list.jsp?cid=120849', '_blank')">
            <div class="banner-inner flex items-center gap-4">
                <div class="banner-icon w-10 h-10 bg-blue-600 rounded-2xl flex items-center justify-center text-xl shadow-blue-200 shadow-lg text-white font-bold">🔥</div>
                <div class="flex-1 overflow-hidden h-10 flex flex-col justify-center text-left">
                    <h3 class="banner-title font-black text-slate-800 text-[14px] tracking-tight leading-tight">하루 1분 투자! 실전 패턴 Pop!</h3>
                    <p class="text-blue-600 font-bold text-[9px] uppercase tracking-widest mt-0.5">수강 신청하고 영어 실력 Pop! →</p>
                </div>
            </div>
        </div>
    </template>

    <!-- [1] 설정 화면 -->
    <div id="setup-screen" class="bg-white p-8 rounded-[2.5rem] shadow-2xl max-w-sm w-full border border-slate-100 my-auto text-center">
        <span class="bg-indigo-100 text-indigo-600 px-4 py-1 rounded-full text-xs font-bold mb-3 inline-block uppercase tracking-widest">GM2 사다리</span>
        <h1 class="text-2xl font-black text-slate-800 mb-1">Day 09 자료</h1>
        <p id="setup-lesson-title" class="text-blue-600 font-bold text-lg italic mb-6 text-center w-full">실전 문형 Drilling! (총 42세트)</p>
        
        <div id="setup-banner-area"></div>

        <!-- 모드 선택 영역 -->
        <div class="mb-6 px-1">
            <p class="text-slate-700 font-bold text-sm mb-3 text-left">학습 모드 선택</p>
            <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1.5 rounded-2xl">
                <button type="button" id="tab-ladder" onclick="selectPlayMode('ladder')" class="py-3 rounded-xl font-black text-xs transition-all mode-btn-active shadow-sm">
                    🪜 사다리 모드
                </button>
                <button type="button" id="tab-random" onclick="selectPlayMode('random')" class="py-3 rounded-xl font-bold text-xs text-slate-500 transition-all hover:text-slate-900">
                    🎲 랜덤 출제 모드
                </button>
            </div>
            <p id="mode-desc" class="text-[11px] font-semibold text-slate-400 mt-2 text-left px-1">설정한 단위만큼 누적해서 촘촘히 훈련합니다.</p>
        </div>

        <!-- 누적 반복 단위 (사다리 모드 전용) -->
        <div id="chunk-setting-box" class="mb-8 px-2 text-left transition-all">
            <div class="flex justify-between items-center mb-3">
                <p class="text-slate-700 font-bold text-sm">누적 반복 단위</p>
                <div class="bg-blue-600 text-white px-3 py-1 rounded-lg font-black text-xl" id="chunk-value">4</div>
            </div>
            <input type="range" id="chunk-slider" min="1" max="8" value="4" oninput="updateChunkDisplay(this.value)" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
        </div>

        <div class="mb-6">
            <button id="auto-mode-btn" onclick="toggleAutoMode()" class="w-full py-4 rounded-2xl border-2 border-slate-100 font-bold text-slate-600 flex items-center justify-center gap-2 transition-all hover:bg-slate-50">
                <span id="auto-icon">⚪</span> 자동 재생 OFF
            </button>
        </div>
        <button onclick="startStudy()" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-bold text-lg shadow-xl active:scale-95 transition-all">연습 시작하기</button>
    </div>

    <!-- [2] 학습 화면 -->
    <div id="study-screen" class="hidden w-full max-w-lg text-slate-900 mx-auto">
        <div class="flex justify-between items-center mb-4 px-2">
            <button onclick="location.reload()" class="p-2 hover:bg-slate-200 rounded-full transition-colors text-slate-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 001 1v4a1 1 0 001 1m-6 0h6" /></svg>
            </button>
            <div id="active-lesson-name" class="text-slate-400 font-black text-xs tracking-widest uppercase text-center flex-1">GM2 Day 09 자료</div>
            <div class="w-10"></div>
        </div>

        <!-- 직전 학습 문장 표시 영역 -->
        <div id="prev-item-box" class="w-full px-8 mb-2 flex flex-col items-center justify-center text-center opacity-0">

            <p id="prev-en" class="text-xs font-black text-blue-300 truncate w-full"></p>

            <div id="timer-gauge-container" class="absolute top-0 left-0 right-0 h-1.5 bg-slate-100 hidden overflow-hidden">
                <div id="timer-gauge-bar" class="h-full bg-orange-500 w-full"></div>
            </div>

            <div class="absolute top-6 left-8 right-8 flex justify-between items-center">
                <div class="flex items-center gap-1.5">
                    <span id="sentence-number" class="bg-slate-100 text-slate-500 px-3 py-1 rounded-lg text-[11px] font-black uppercase tracking-tighter">No.1</span>
                    <span id="speaker-badge" class="bg-indigo-600 text-white px-2.5 py-1 rounded-lg text-[10px] font-black uppercase tracking-tight">문장</span>
                </div>

                    <span id="badge-playmode" class="text-[9px] font-black px-2 py-0.5 rounded-full bg-blue-50 text-blue-600 uppercase tracking-tighter">사다리</span>
                    <button onclick="switchModeInGame()" id="mode-switch-btn" class="text-slate-300 font-bold text-[10px] underline decoration-slate-100 hover:text-blue-400 transition-colors">자동 모드 전환</button>

                </div>
            </div>

            <!-- B 차례일 때 상단에 A의 대화를 맥락으로 보여주는 영역 -->
            <div id="context-box" class="hidden mt-6 mb-5 p-4 bg-slate-50 border border-slate-100 rounded-2xl text-left transition-all">
                <p id="context-kr" class="text-xs md:text-sm font-bold text-slate-500 mb-1 natural-wrap"></p>
                <p id="context-en" class="text-xs md:text-sm font-black text-blue-600 natural-wrap"></p>
            </div>

            <!-- 현재 문제 한국어 -->

                <span id="role-tag" class="w-7 h-7 shrink-0 rounded-full bg-slate-900 text-white font-black text-xs flex items-center justify-center shadow-sm mt-0.5">A</span>
                <div id="kr-box" class="text-xl md:text-2xl font-black text-slate-800 natural-wrap text-center flex-1"></div>
            </div>

            <!-- 현재 문제 영어 정답 -->
            <div id="en-box" class="invisible opacity-0 translate-y-3 transition-all duration-300 w-full text-center">
                <div class="h-[1px] bg-slate-100 w-16 mx-auto mb-5"></div>
                <div id="en-text" class="text-xl md:text-2xl font-black text-blue-600 natural-wrap text-center px-2"></div>
            </div>

            <div id="finish-ui" class="hidden absolute inset-0 bg-white z-50 flex flex-col items-center justify-center p-6 text-center rounded-[3rem]">
                <p class="text-4xl mb-4">🎉</p>
                <h2 class="text-2xl font-black mb-2 text-slate-800">연습 완료!</h2>
                <div id="finish-banner-area" class="w-full"></div>
                <button id="cal-confirm-btn" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg mb-2">복습 알림 예약하기</button>
                <button onclick="location.reload()" class="text-slate-400 text-sm font-bold py-2">그냥 종료하기</button>
            </div>
        </div>

        <div id="study-banner-area"></div>

        <div id="control-panel" class="flex flex-col gap-3 mb-6">
            <div class="flex gap-2">
                <button onclick="prevStep()" id="prev-btn" class="w-16 bg-white border-2 border-slate-100 text-slate-300 py-5 rounded-[1.8rem] font-black text-xl active:scale-95 transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7" /></svg>
                </button>
                <button onclick="handleAction()" id="main-btn" class="flex-1 bg-slate-900 text-white py-5 rounded-[1.8rem] font-black text-lg shadow-2xl active:scale-95 transition-all">정답 확인</button>
            </div>
        </div>

        <div id="progress-container" class="h-4 flex items-center w-full mb-2">
            <div class="h-1.5 w-full bg-slate-200 rounded-full overflow-hidden pointer-events-none">
                <div id="progress-bar" class="h-full bg-orange-500 transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>
        <p id="progress-text" class="text-center text-slate-400 text-[9px] font-bold uppercase tracking-widest pb-6 pointer-events-none">Step 1 / 00</p>
    </div>

    <script>

            {

                a_kr: "네가 그러려고 했던 건 아니었지만,<br>마지막으로 네가 남의 기분을 상하게 했던 게 언제였어?",

            { num: "27", isDialogue: false, kr: "날 그만 쳐다봐줄래?", en: "Could you stop looking at me?" },

            { num: "35", isDialogue: false, kr: "난 걔(남자)랑 얘기하는 거 재미없다니까!", en: "I'm telling you I don't enjoy talking with him!" },

            { num: "40", isDialogue: false, kr: "너 다시 탄수화물 먹는 게 기대되지?", en: "You're looking forward to eating carbs again, aren't you?" },
            { num: "41", isDialogue: false, kr: "넌 오늘 밤에 무슨 노래 듣는 걸 기대하고 있어?", en: "What song are you looking forward to listening to tonight?" },

            // 42 (대화형)
            {
                num: "42", isDialogue: true,
                a_kr: "디싸이플들은 진짜 영어 잘해.",
                a_en: "Disciples are really good at English.",
                b_kr: "응, 그래서 내가 PSE 졸업하는 게 기대되는 거야.",
                b_en: "Yeah, that's why I'm looking forward to graduating from PSE."

        ];

        let playMode = 'ladder'; // 'ladder' | 'random'
        let studySequence = [], currentIdx = 0, selectedChunkSize = 4;
        let isAutoMode = false;
        let subStep = 0; // 0: A/단일문제, 1: A/단일정답, 2: B문제, 3: B정답

        let autoGaugeTimer = null;
        const THINK_TIME = 4500;
        const CONFIRM_TIME = 2800;

        const bannerMsgs = [
            { icon: "🔥", text: "하루 1분 투자! 실전 패턴 Pop!" },
            { icon: "🎬", text: "미드 보면서 실전 영어 패턴도 Pop!" }
        ];
        let currentBannerIdx = 0;

        function injectBanners() {
            const template = document.getElementById('banner-template').content;
            ['setup-banner-area', 'study-banner-area', 'finish-banner-area'].forEach(id => {
                const area = document.getElementById(id);
                if (area) area.appendChild(template.cloneNode(true));
            });
        }

        function rotateBanners() {
            currentBannerIdx = (currentBannerIdx + 1) % bannerMsgs.length;
            const msg = bannerMsgs[currentBannerIdx];
            document.querySelectorAll('.promo-banner').forEach(banner => {
                const inner = banner.querySelector('.banner-inner');
                if(!inner) return;
                inner.style.opacity = 0;
                inner.style.transform = "translateY(3px)";
                setTimeout(() => {
                    banner.querySelector('.banner-icon').innerText = msg.icon;
                    banner.querySelector('.banner-title').innerText = msg.text;
                    inner.style.opacity = 1;
                    inner.style.transform = "translateY(0)";
                }, 500);
            });
        }

        function selectPlayMode(mode) {
            playMode = mode;
            const ladderTab = document.getElementById('tab-ladder');
            const randomTab = document.getElementById('tab-random');
            const chunkBox = document.getElementById('chunk-setting-box');
            const modeDesc = document.getElementById('mode-desc');

            if (mode === 'ladder') {
                ladderTab.className = "py-3 rounded-xl font-black text-xs transition-all mode-btn-active shadow-sm";
                randomTab.className = "py-3 rounded-xl font-bold text-xs text-slate-500 transition-all hover:text-slate-900";
                chunkBox.classList.remove('hidden');
                modeDesc.innerText = "설정한 단위만큼 누적해서 촘촘히 훈련합니다.";
            } else {
                randomTab.className = "py-3 rounded-xl font-black text-xs transition-all mode-btn-active shadow-sm";
                ladderTab.className = "py-3 rounded-xl font-bold text-xs text-slate-500 transition-all hover:text-slate-900";
                chunkBox.classList.add('hidden');
                modeDesc.innerText = `${rawData.length}개 세트가 중복 없이 모두 끝날 때까지 무작위로 출제됩니다.`;
            }
        }

        function updateChunkDisplay(val) {
            selectedChunkSize = parseInt(val);
            document.getElementById('chunk-value').innerText = val;
        }

        function toggleAutoMode() {
            isAutoMode = !isAutoMode;
            const btn = document.getElementById('auto-mode-btn');
            btn.innerHTML = isAutoMode ? `<span>🟠</span> 자동 재생 ON` : `<span>⚪</span> 자동 재생 OFF`;
            btn.className = `w-full py-4 rounded-2xl border-2 font-bold flex items-center justify-center gap-2 transition-all ${isAutoMode ? 'auto-active' : 'border-slate-100 text-slate-600'}`;
        }

        function switchModeInGame() {
            isAutoMode = !isAutoMode;
            updateInGameModeUI();
            if(isAutoMode) {
                runAutoGauge((subStep === 1 || subStep === 3) ? CONFIRM_TIME : THINK_TIME);
            } else {
                stopAutoGauge();
            }
        }

        function updateInGameModeUI() {
            const status = document.getElementById('mode-status');
            const switchBtn = document.getElementById('mode-switch-btn');
            if(isAutoMode) {
                status.innerText = "자동";
                status.className = "text-[9px] font-black px-2 py-0.5 rounded-full bg-orange-100 text-orange-600 uppercase tracking-tighter";
                switchBtn.innerText = "수동 전환";
            } else {
                status.innerText = "수동";
                status.className = "text-[9px] font-black px-2 py-0.5 rounded-full bg-slate-50 text-slate-300 uppercase tracking-tighter";
                switchBtn.innerText = "자동 전환";
            }
        }

        function runAutoGauge(duration) {
            stopAutoGauge();
            if (!isAutoMode) return;

            const container = document.getElementById('timer-gauge-container');
            const bar = document.getElementById('timer-gauge-bar');
            container.classList.remove('hidden');

            bar.style.transition = 'none';
            bar.style.width = '100%';

            const startTime = Date.now();
            const tickInterval = 50;

            requestAnimationFrame(() => {
                bar.style.transition = `width ${tickInterval}ms linear`;
            });

            autoGaugeTimer = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const remaining = Math.max(0, duration - elapsed);
                const percent = (remaining / duration) * 100;
                bar.style.width = `${percent}%`;

                if (remaining <= 0) {
                    stopAutoGauge();
                    handleAction();
                }
            }, tickInterval);
        }

        function stopAutoGauge() {
            if (autoGaugeTimer) {
                clearInterval(autoGaugeTimer);
                autoGaugeTimer = null;
            }
            const container = document.getElementById('timer-gauge-container');
            const bar = document.getElementById('timer-gauge-bar');
            if (container) container.classList.add('hidden');
            if (bar) bar.style.width = '100%';
        }

        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function startStudy() {
            studySequence = [];
            
            if (playMode === 'ladder') {
                for (let i = 0; i < rawData.length; i += selectedChunkSize) {
                    let end = Math.min(i + selectedChunkSize - 1, rawData.length - 1);
                    for (let j = i; j <= end; j++) {
                        for (let k = i; k <= j; k++) studySequence.push({ data: rawData[k] });
                    }
                    if (end > i) {
                        for (let j = end; j >= i; j--) {
                            for (let k = end; k >= j; k--) studySequence.push({ data: rawData[k] });
                        }
                    }
                }
            } else {
                const shuffled = shuffleArray(rawData);
                studySequence = shuffled.map(item => ({ data: item }));
            }

            currentIdx = 0;
            subStep = 0;
            document.getElementById('badge-playmode').innerText = playMode === 'ladder' ? '사다리' : '랜덤';
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('study-screen').classList.remove('hidden');
            initProgressControl();
            updateInGameModeUI();
            render();
        }

        function render() {
            stopAutoGauge();
            const item = studySequence[currentIdx].data;
            
            // 직전 학습한 문제 요약
            const prevBox = document.getElementById('prev-item-box');
            if (currentIdx > 0) {
                const prevItem = studySequence[currentIdx - 1].data;
                if (prevItem.isDialogue) {
                    document.getElementById('prev-kr').innerText = `Last: A: ${prevItem.a_kr.replace(/<[^>]*>/g, ' ')} / B: ${prevItem.b_kr.replace(/<[^>]*>/g, ' ')}`;
                    document.getElementById('prev-en').innerText = `A: ${prevItem.a_en.replace(/<[^>]*>/g, ' ')} / B: ${prevItem.b_en.replace(/<[^>]*>/g, ' ')}`;
                } else {
                    document.getElementById('prev-kr').innerText = `Last: ${prevItem.kr.replace(/<[^>]*>/g, ' ')}`;
                    document.getElementById('prev-en').innerText = prevItem.en.replace(/<[^>]*>/g, ' ');
                }
                prevBox.classList.remove('opacity-0');
                prevBox.classList.add('opacity-40');
            } else {
                prevBox.classList.remove('opacity-40');
                prevBox.classList.add('opacity-0');
            }

            document.getElementById('sentence-number').innerText = `No.${item.num}`;
            document.getElementById('progress-text').innerText = `Set ${currentIdx + 1} / ${studySequence.length}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx) / (studySequence.length - 1)) * 100}%`;

            const prevBtn = document.getElementById('prev-btn');
            if (currentIdx > 0 || subStep > 0) {
                prevBtn.classList.remove('text-slate-300', 'pointer-events-none');
                prevBtn.classList.add('text-slate-600');
            } else {
                prevBtn.classList.add('text-slate-300', 'pointer-events-none');
                prevBtn.classList.remove('text-slate-600');
            }

            const speakerBadge = document.getElementById('speaker-badge');
            const roleTag = document.getElementById('role-tag');
            const krBox = document.getElementById('kr-box');
            const enBox = document.getElementById('en-box');
            const enText = document.getElementById('en-text');
            const contextBox = document.getElementById('context-box');
            const contextKr = document.getElementById('context-kr');
            const contextEn = document.getElementById('context-en');
            const mainBtn = document.getElementById('main-btn');

            if (item.isDialogue) {
                roleTag.classList.remove('hidden');
                if (subStep === 0) {
                    speakerBadge.innerText = "A 질문";
                    speakerBadge.className = "bg-blue-600 text-white px-2.5 py-1 rounded-lg text-[10px] font-black uppercase tracking-tight";
                    roleTag.innerText = "A";
                    roleTag.className = "w-7 h-7 shrink-0 rounded-full bg-blue-600 text-white font-black text-xs flex items-center justify-center shadow-sm mt-0.5";
                    contextBox.classList.add('hidden');
                    krBox.innerHTML = item.a_kr;
                    enText.innerHTML = item.a_en;
                    enBox.classList.add('invisible', 'opacity-0');
                    mainBtn.innerText = "A 정답 확인";
                    if (isAutoMode) runAutoGauge(THINK_TIME);
                } else if (subStep === 1) {
                    enBox.classList.remove('invisible', 'opacity-0');
                    mainBtn.innerText = "B 문제 풀기 →";
                    if (isAutoMode) runAutoGauge(CONFIRM_TIME);
                } else if (subStep === 2) {
                    speakerBadge.innerText = "B 답변";
                    speakerBadge.className = "bg-orange-500 text-white px-2.5 py-1 rounded-lg text-[10px] font-black uppercase tracking-tight";
                    roleTag.innerText = "B";
                    roleTag.className = "w-7 h-7 shrink-0 rounded-full bg-orange-500 text-white font-black text-xs flex items-center justify-center shadow-sm mt-0.5";
                    
                    contextKr.innerHTML = "<span class='text-slate-400 font-bold'>A:</span> " + item.a_kr;
                    contextEn.innerHTML = "<span class='text-blue-400 font-black'>A:</span> " + item.a_en;
                    contextBox.classList.remove('hidden');

                    krBox.innerHTML = item.b_kr;
                    enText.innerHTML = item.b_en;
                    enBox.classList.add('invisible', 'opacity-0');
                    mainBtn.innerText = "B 정답 확인";
                    if (isAutoMode) runAutoGauge(THINK_TIME);
                } else if (subStep === 3) {
                    enBox.classList.remove('invisible', 'opacity-0');
                    mainBtn.innerText = "다음 세트 →";
                    if (isAutoMode) runAutoGauge(CONFIRM_TIME);
                }
            } else {
                contextBox.classList.add('hidden');
                roleTag.classList.add('hidden');
                speakerBadge.innerText = "문장";
                speakerBadge.className = "bg-indigo-600 text-white px-2.5 py-1 rounded-lg text-[10px] font-black uppercase tracking-tight";
                
                krBox.innerHTML = item.kr;
                enText.innerHTML = item.en;

                if (subStep === 0) {
                    enBox.classList.add('invisible', 'opacity-0');
                    mainBtn.innerText = "정답 확인";
                    if (isAutoMode) runAutoGauge(THINK_TIME);
                } else {
                    enBox.classList.remove('invisible', 'opacity-0');
                    mainBtn.innerText = "다음 세트 →";
                    if (isAutoMode) runAutoGauge(CONFIRM_TIME);
                }
            }
        }

        function handleAction() {
            stopAutoGauge();
            const item = studySequence[currentIdx].data;

            if (item.isDialogue) {
                if (subStep === 0) {
                    subStep = 1;
                    render();
                } else if (subStep === 1) {
                    subStep = 2;
                    render();
                } else if (subStep === 2) {
                    subStep = 3;
                    render();
                } else if (subStep === 3) {
                    currentIdx++;
                    subStep = 0;
                    if (currentIdx < studySequence.length) render();
                    else finishStudy();
                }
            } else {
                if (subStep === 0) {
                    subStep = 1;
                    render();
                } else {
                    currentIdx++;
                    subStep = 0;
                    if (currentIdx < studySequence.length) render();
                    else finishStudy();
                }
            }
        }

        function prevStep() {
            if (subStep > 0) {
                subStep--;
                render();
            } else if (currentIdx > 0) {
                currentIdx--;
                const prevItem = studySequence[currentIdx].data;
                subStep = prevItem.isDialogue ? 3 : 1;
                render();
            }
        }

        function initProgressControl() {
            const container = document.getElementById('progress-container');
            const seek = (e) => {
                const rect = container.getBoundingClientRect();
                const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
                let percent = x / rect.width;
                percent = Math.max(0, Math.min(1, percent));
                const newIdx = Math.round(percent * (studySequence.length - 1));
                if (newIdx !== currentIdx) {
                    currentIdx = newIdx;
                    subStep = 0;
                    render();
                }
            };
            container.addEventListener('mousedown', (e) => {
                seek(e);
                const onMouseMove = (moveEvent) => seek(moveEvent);
                const onMouseUp = () => {
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                };
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });
            container.addEventListener('touchstart', (e) => {
                seek(e);
                const onTouchMove = (moveEvent) => {
                    moveEvent.preventDefault();
                    seek(moveEvent);
                };
                const onTouchEnd = () => {
                    document.removeEventListener('touchmove', onTouchMove);
                    document.removeEventListener('touchend', onTouchEnd);
                };
                document.addEventListener('touchmove', onTouchMove, { passive: false });
                document.addEventListener('touchend', onTouchEnd);
            });
        }

        function finishStudy() {
            stopAutoGauge();
            document.getElementById('finish-ui').classList.remove('hidden');
            document.getElementById('prev-item-box').classList.add('hidden');
            document.getElementById('study-banner-area').style.display = 'none';
            document.getElementById('control-panel').style.display = 'none';
            
            const btn = document.getElementById('cal-confirm-btn');
            btn.onclick = function() {
                const days = prompt("며칠 뒤에 복습 알림을 예약할까요? (1~30)", "1");
                if (!days) return;
                const targetDate = new Date();
                targetDate.setDate(targetDate.getDate() + parseInt(days));
                const dateStr = targetDate.toISOString().replace(/-|:|\.\d+/g, '').slice(0, 8);
                const modeName = playMode === 'ladder' ? '사다리 모드' : '랜덤 모드';
                const title = encodeURIComponent(`[복습] GM2 Day 09 (${modeName})`);
                const details = encodeURIComponent(`셀프 드릴링 복습하기!\n\n🔗 주소: ${window.location.href}`);
                location.href = `https://www.google.com/calendar/render?action=TEMPLATE&text=${title}&details=${details}&dates=${dateStr}T090000/${dateStr}T100000`;
            };
        }

        window.onload = () => {
            injectBanners();
            setInterval(rotateBanners, 4000);
        };
    </script>
</body>
</html>
