let qs=[...base],idx=0,done=false;
function startApp(){qs=[...base];for(let i=qs.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[qs[i],qs[j]]=[qs[j],qs[i]]}idx=0;document.getElementById('start').classList.remove('active');document.getElementById('quiz').classList.add('active');render()}
function render(){done=false;let q=qs[idx];document.getElementById('counter').textContent=`Question ${idx+1} / ${qs.length}`;document.getElementById('progress').style.width=((idx+1)/qs.length*100)+'%';document.getElementById('category').textContent=q[0];document.getElementById('prompt').textContent=q[1];document.getElementById('translation').textContent=q[2];document.getElementById('answer').classList.remove('show');let box=document.getElementById('options');box.innerHTML='';q[3].forEach((v,i)=>{let b=document.createElement('button');b.className='option';b.innerHTML=`<span class="letter">${i?'B':'A'}</span><span class="en">${v}</span><span class="ko">${q[4][i]}</span>`;b.onclick=()=>choose(i);box.appendChild(b)})}
function choose(i){let q=qs[idx];document.querySelectorAll('.option').forEach((b,j)=>b.classList.toggle('selected',i===j));document.getElementById('answerEn').textContent=q[5][i];document.getElementById('answerKo').textContent=q[6][i];document.getElementById('answer').classList.add('show')}
function resetChoice(){document.querySelectorAll('.option').forEach(b=>b.classList.remove('selected'));document.getElementById('answer').classList.remove('show')}
function nextQ(){if(idx<qs.length-1){idx++;render()}else{document.getElementById('category').textContent='COMPLETE';document.getElementById('prompt').textContent='Great job!';document.getElementById('translation').textContent='20개 질문을 모두 연습했어요.';document.getElementById('options').innerHTML='';document.getElementById('answer').classList.remove('show');document.getElementById('counter').textContent='Complete!';document.getElementById('progress').style.width='100%';done=true}}
function prevQ(){if(idx>0){idx--;render()}}
function shuffleQuestions(){for(let i=qs.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[qs[i],qs[j]]=[qs[j],qs[i]]}idx=0;render()}
