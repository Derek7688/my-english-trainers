.card-container{min-height:390px;display:flex;flex-direction:column;justify-content:center}

.nav-control{height:56px;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.hide-control{width:92px;flex:0 0 92px;transition:opacity .18s ease,background-color .18s ease,color .18s ease}

<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-start p-4">

<template id="banner-template">

    <div class="banner-inner flex items-center gap-4">

    </div>
    <p id="mode-desc" class="text-[11px] font-semibold text-slate-400 mt-2 px-1">핵심 문장 30개를 1번부터 순서대로 연습합니다.</p>
  </div>
  <div class="mb-6">

  <button onclick="startStudy()" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-bold text-lg shadow-xl active:scale-95 transition-all">연습 시작하기</button>
</div>

let contentMode='core',orderMode='ordered',studySequence=[],currentIdx=0,isRevealed=false,isAutoMode=false,autoGaugeTimer=null;
const KR_THINK_TIME=5000,EN_CONFIRM_TIME=2500;
const bannerMsgs=[{icon:'🔥',text:'하루 1분 투자! 실전 패턴 Pop!'},{icon:'🎬',text:'미드 보면서 실전 영어 패턴도 Pop!'}];
let currentBannerIdx=0;
function injectBanners(){
  const t=document.getElementById('banner-template').content;
  ['setup-banner-area','study-banner-area','finish-banner-area'].forEach(id=>{const a=document.getElementById(id);if(a)a.appendChild(t.cloneNode(true));});
}
function rotateBanners(){
  currentBannerIdx=(currentBannerIdx+1)%bannerMsgs.length;const m=bannerMsgs[currentBannerIdx];
  document.querySelectorAll('.promo-banner').forEach(b=>{const i=b.querySelector('.banner-inner');if(!i)return;i.style.opacity=0;i.style.transform='translateY(3px)';setTimeout(()=>{b.querySelector('.banner-icon').innerText=m.icon;b.querySelector('.banner-title').innerText=m.text;i.style.opacity=1;i.style.transform='translateY(0)';},500);});
}
function selectContentMode(m){contentMode=m;updateSelections();}
function selectOrderMode(m){orderMode=m;updateSelections();}
function updateSelections(){
  [['core','tab-core',contentMode],['applied','tab-applied',contentMode],['ordered','tab-ordered',orderMode],['random','tab-random',orderMode]].forEach(([v,id,s])=>{
    document.getElementById(id).className=v===s?'py-3 rounded-xl font-black text-xs transition-all mode-btn-active shadow-sm':'py-3 rounded-xl font-bold text-xs text-slate-500 transition-all';
  });
  document.getElementById('mode-desc').innerText=`${contentMode==='core'?'핵심 문장 30개':'응용 문장 60개'}를 ${orderMode==='ordered'?'순서대로':'중복 없이 랜덤으로'} 연습합니다.`;
}
function toggleAutoMode(){
  isAutoMode=!isAutoMode;const b=document.getElementById('auto-mode-btn');
  b.innerHTML=isAutoMode?'🟠 자동 재생 ON':'⚪ 자동 재생 OFF';
  b.className=`w-full py-4 rounded-2xl border-2 font-bold flex items-center justify-center gap-2 transition-all ${isAutoMode?'auto-active':'border-slate-100 text-slate-600'}`;
}
function switchModeInGame(){isAutoMode=!isAutoMode;updateInGameModeUI();if(isAutoMode)runAutoGauge(isRevealed?EN_CONFIRM_TIME:KR_THINK_TIME);else stopAutoGauge();}
function updateInGameModeUI(){
  const s=document.getElementById('mode-status'),b=document.getElementById('mode-switch-btn');
  s.innerText=isAutoMode?'자동':'수동';
  s.className=isAutoMode?'text-[9px] font-black px-2 py-0.5 rounded-full bg-orange-100 text-orange-600':'text-[9px] font-black px-2 py-0.5 rounded-full bg-slate-50 text-slate-300';
  b.innerText=isAutoMode?'수동 전환':'자동 전환';
}
function runAutoGauge(duration){
  stopAutoGauge();if(!isAutoMode)return;
  const c=document.getElementById('timer-gauge-container'),bar=document.getElementById('timer-gauge-bar');
  c.classList.remove('hidden');bar.style.transition='none';bar.style.width='100%';const start=Date.now();
  requestAnimationFrame(()=>bar.style.transition='width 50ms linear');
  autoGaugeTimer=setInterval(()=>{const left=Math.max(0,duration-(Date.now()-start));bar.style.width=`${left/duration*100}%`;if(left<=0){stopAutoGauge();handleAction();}},50);
}
function stopAutoGauge(){
  if(autoGaugeTimer){clearInterval(autoGaugeTimer);autoGaugeTimer=null;}
  const c=document.getElementById('timer-gauge-container'),b=document.getElementById('timer-gauge-bar');if(c)c.classList.add('hidden');if(b)b.style.width='100%';
}
function shuffleArray(a){const c=[...a];for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];}return c;}
function startStudy(){
  const source=contentMode==='core'?coreData:appliedData;studySequence=orderMode==='random'?shuffleArray(source):[...source];currentIdx=0;
  document.getElementById('badge-playmode').innerText=`${contentMode==='core'?'핵심':'응용'} · ${orderMode==='ordered'?'순서':'랜덤'}`;
  document.getElementById('setup-screen').classList.add('hidden');document.getElementById('study-screen').classList.remove('hidden');
  initProgressControl();updateInGameModeUI();render();
}
function render(){
  stopAutoGauge();const item=studySequence[currentIdx],pb=document.getElementById('prev-item-box');
  if(currentIdx>0){const p=studySequence[currentIdx-1];document.getElementById('prev-kr').innerText='직전: '+p.kr;document.getElementById('prev-en').innerText=contentMode==='applied'?p.en:'';document.getElementById('prev-en').classList.toggle('hidden',contentMode==='core');pb.classList.remove('opacity-0');pb.classList.add('opacity-40');}
  else{pb.classList.add('opacity-0');pb.classList.remove('opacity-40');document.getElementById('prev-en').classList.toggle('hidden',contentMode==='core');}
  document.getElementById('sentence-number').innerText=`${item.num} · ${currentIdx+1}/${studySequence.length}`;
  const ref=document.getElementById('core-reference');
  if(contentMode==='core')ref.classList.add('hidden');else{ref.classList.remove('hidden');ref.innerText=`핵심 문장 ${item.coreNum}: ${item.coreEn}`;}
  document.getElementById('kr-box').innerText=item.kr;document.getElementById('en-text').innerText=item.en;
  document.getElementById('answer-note').classList.toggle('hidden',contentMode==='core');
  document.getElementById('progress-text').innerText=`Step ${currentIdx+1} / ${studySequence.length}`;
  document.getElementById('progress-bar').style.width=`${studySequence.length<=1?100:currentIdx/(studySequence.length-1)*100}%`;
  document.getElementById('en-box').className='answer-hidden transition-all duration-500 w-full text-center';
  document.getElementById('main-btn').innerText='정답 확인';setHideButtonState(false);isRevealed=false;
  const prev=document.getElementById('prev-btn');prev.classList.toggle('text-slate-300',currentIdx===0);prev.classList.toggle('text-slate-500',currentIdx>0);prev.classList.toggle('opacity-40',currentIdx===0);prev.classList.toggle('pointer-events-none',currentIdx===0);
  if(isAutoMode)runAutoGauge(KR_THINK_TIME);
}
function handleAction(){
  stopAutoGauge();
  if(!isRevealed){document.getElementById('en-box').className='answer-visible transition-all duration-500 w-full text-center';document.getElementById('main-btn').innerText='다음 문제';setHideButtonState(true);isRevealed=true;if(isAutoMode)runAutoGauge(EN_CONFIRM_TIME);}
  else{currentIdx++;if(currentIdx<studySequence.length)render();else finishStudy();}
}
function setHideButtonState(available){
  const b=document.getElementById('hide-answer-btn');b.classList.toggle('is-available',available);b.classList.toggle('is-unavailable',!available);b.setAttribute('aria-disabled',String(!available));
}
function hideAnswer(){
  if(!isRevealed)return;stopAutoGauge();document.getElementById('en-box').className='answer-hidden transition-all duration-500 w-full text-center';
  document.getElementById('main-btn').innerText='정답 확인';setHideButtonState(false);isRevealed=false;if(isAutoMode)runAutoGauge(KR_THINK_TIME);
}
function prevStep(){if(currentIdx>0){currentIdx--;render();}}
function initProgressControl(){
  const c=document.getElementById('progress-container');
  const seek=e=>{const r=c.getBoundingClientRect(),x=(e.touches?e.touches[0].clientX:e.clientX)-r.left,p=Math.max(0,Math.min(1,x/r.width)),n=Math.round(p*(studySequence.length-1));if(n!==currentIdx){currentIdx=n;render();}};
  c.onmousedown=e=>{seek(e);const move=m=>seek(m),up=()=>{document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);};document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);};
  c.ontouchstart=e=>{seek(e);const move=m=>{m.preventDefault();seek(m);},up=()=>{document.removeEventListener('touchmove',move);document.removeEventListener('touchend',up);};document.addEventListener('touchmove',move,{passive:false});document.addEventListener('touchend',up);};
}
function finishStudy(){
  stopAutoGauge();document.getElementById('finish-ui').classList.remove('hidden');document.getElementById('prev-item-box').classList.add('hidden');
  document.getElementById('study-banner-area').style.display='none';document.getElementById('control-panel').style.display='none';
  document.getElementById('finish-summary').innerText=`${studySequence.length}개 드릴을 모두 마쳤습니다. 수고하셨습니다!`;
  document.getElementById('cal-confirm-btn').onclick=()=>{
    const days=prompt('며칠 뒤에 복습 알림을 예약할까요? (1~30)','1');if(!days)return;
    const n=Math.max(1,Math.min(30,parseInt(days)||1)),d=new Date();d.setDate(d.getDate()+n);
    const date=d.toISOString().replace(/-|:|\\.\\d+/g,'').slice(0,8);
    const title=encodeURIComponent(`[복습] Past 4강 2교시 Question Drill (${contentMode==='core'?'핵심':'응용'} · ${orderMode==='ordered'?'순서':'랜덤'} 모드)`);
    const details=encodeURIComponent(`Past 4강 2교시 There was / There were 드릴 복습하기!\\n\\n🔗 주소: ${location.href}`);
    location.href=`https://www.google.com/calendar/render?action=TEMPLATE&text=${title}&details=${details}&dates=${date}T090000/${date}T100000`;
  };
}
window.onload=()=>{injectBanners();setInterval(rotateBanners,4000);};
