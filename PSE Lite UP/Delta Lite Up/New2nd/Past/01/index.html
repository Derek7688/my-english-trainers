<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Past 1강 2교시 | Question Drill</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap');
body{font-family:'Pretendard',sans-serif;touch-action:manipulation}
.card-container{min-height:390px;display:flex;flex-direction:column;justify-content:center}
.banner-inner{transition:all .5s ease}
#progress-container{cursor:pointer;touch-action:none}
#timer-gauge-bar{transition:width 50ms linear}
.mode-btn-active{background:#0f172a!important;color:#fff!important;border-color:#0f172a!important}
.auto-active{background:#f97316!important;color:#fff!important;border-color:#f97316!important}
.answer-hidden{visibility:hidden;opacity:0;transform:translateY(12px);pointer-events:none}
.answer-visible{visibility:visible;opacity:1;transform:translateY(0)}
#control-panel{min-height:64px}
.nav-control{height:56px;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.hide-control{width:92px;flex:0 0 92px;transition:opacity .18s ease,background-color .18s ease,color .18s ease}
.hide-control.is-unavailable{opacity:.35;cursor:default}
.hide-control.is-available{opacity:1}
</style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-start p-4">

<template id="banner-template">
  <div class="promo-banner bg-white border border-blue-50 p-4 rounded-[2.2rem] mb-6 cursor-pointer shadow-lg transition-all active:scale-95 w-full max-w-sm mx-auto" onclick="window.open('https://www.pse-learning.co.kr/course/course_list.jsp?cid=120849','_blank')">
    <div class="banner-inner flex items-center gap-4">
      <div class="banner-icon w-10 h-10 bg-blue-600 rounded-2xl flex items-center justify-center text-xl shadow-blue-200 shadow-lg text-white font-bold">🔥</div>
      <div class="flex-1 overflow-hidden h-10 flex flex-col justify-center text-left">
        <h3 class="banner-title font-black text-slate-800 text-[14px] tracking-tight leading-tight">하루 1분 투자! 실전 패턴 Pop!</h3>
        <p class="text-blue-600 font-bold text-[9px] uppercase tracking-widest mt-0.5">수강 신청하고 영어 실력 Pop! →</p>
      </div>
    </div>
  </div>
</template>

<div id="setup-screen" class="bg-white p-7 sm:p-8 rounded-[2.5rem] shadow-2xl max-w-sm w-full border border-slate-100 my-auto text-center">
  <h1 class="text-2xl font-black text-slate-800 mb-5">Past 1강 2교시</h1>
  <p class="text-slate-500 text-xs leading-relaxed mb-5">한국어 질문을 보고 영어로 말한 뒤 정답을 확인하세요.<br>핵심 문장 40개 또는 응용 문장 80개를 연습할 수 있습니다.</p>
  <div id="setup-banner-area"></div>

  <div class="mb-5 px-1 text-left">
    <p class="text-slate-700 font-bold text-sm mb-3">연습할 문장 선택</p>
    <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1.5 rounded-2xl">
      <button id="tab-core" onclick="selectContentMode('core')" class="py-3 rounded-xl font-black text-xs transition-all mode-btn-active shadow-sm">📘 핵심 문장 40개</button>
      <button id="tab-applied" onclick="selectContentMode('applied')" class="py-3 rounded-xl font-bold text-xs text-slate-500 transition-all">🔄 응용 문장 80개</button>
    </div>
  </div>

  <div class="mb-6 px-1 text-left">
    <p class="text-slate-700 font-bold text-sm mb-3">출제 순서 선택</p>
    <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1.5 rounded-2xl">
      <button id="tab-ordered" onclick="selectOrderMode('ordered')" class="py-3 rounded-xl font-black text-xs transition-all mode-btn-active shadow-sm">🔢 순서대로</button>
      <button id="tab-random" onclick="selectOrderMode('random')" class="py-3 rounded-xl font-bold text-xs text-slate-500 transition-all">🎲 랜덤</button>
    </div>
    <p id="mode-desc" class="text-[11px] font-semibold text-slate-400 mt-2 px-1">핵심 문장 40개를 1번부터 순서대로 연습합니다.</p>
  </div>

  <div class="mb-6">
    <button id="auto-mode-btn" onclick="toggleAutoMode()" class="w-full py-4 rounded-2xl border-2 border-slate-100 font-bold text-slate-600 flex items-center justify-center gap-2 transition-all"><span id="auto-icon">⚪</span> 자동 재생 OFF</button>
    <p class="text-[10px] text-slate-400 mt-2">자동 재생은 생각 시간 후 정답을 보여주고 다음 문제로 넘어갑니다.</p>
  </div>
  <button onclick="startStudy()" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-bold text-lg shadow-xl active:scale-95 transition-all">연습 시작하기</button>
</div>

<div id="study-screen" class="hidden w-full max-w-lg text-slate-900 mx-auto">
  <div class="flex justify-between items-center mb-4 px-2">
    <button onclick="location.reload()" class="p-2 hover:bg-slate-200 rounded-full text-slate-400" aria-label="처음으로">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0h6"/></svg>
    </button>
    <div id="active-lesson-name" class="text-slate-400 font-black text-xs tracking-widest uppercase text-center flex-1">PAST · QUESTION DRILL</div>
    <div class="w-10"></div>
  </div>

  <div id="prev-item-box" class="w-full px-8 mb-2 flex flex-col items-center justify-center text-center opacity-0 min-h-12">
    <p id="prev-kr" class="text-xs font-bold text-slate-400 truncate w-full"></p>
    <p id="prev-en" class="text-xs font-black text-blue-300 truncate w-full"></p>
  </div>

  <div class="bg-white p-8 sm:p-10 rounded-[3rem] shadow-2xl card-container text-center mb-5 border border-slate-50 relative overflow-hidden">
    <div id="timer-gauge-container" class="absolute top-0 left-0 right-0 h-1.5 bg-slate-100 hidden overflow-hidden"><div id="timer-gauge-bar" class="h-full bg-orange-500 w-full"></div></div>
    <div class="absolute top-6 left-7 right-7 flex justify-between items-center">
      <span id="sentence-number" class="bg-slate-100 text-slate-400 px-3 py-1 rounded-lg text-[10px] font-black">01</span>
      <div class="flex items-center gap-2">
        <span id="badge-playmode" class="text-[9px] font-black px-2 py-0.5 rounded-full bg-blue-50 text-blue-600">핵심 · 순서</span>
        <button onclick="switchModeInGame()" id="mode-switch-btn" class="text-slate-300 font-bold text-[10px] underline">자동 전환</button>
        <div id="mode-status" class="text-[9px] font-black px-2 py-0.5 rounded-full bg-slate-50 text-slate-300">수동</div>
      </div>
    </div>
    <div id="core-reference" class="text-xs text-slate-400 font-bold mb-5 mt-5 hidden"></div>
    <div id="kr-box" class="text-2xl sm:text-3xl font-bold text-slate-800 leading-relaxed mb-8 break-keep px-2"></div>
    <div id="en-box" class="answer-hidden transition-all duration-500 w-full text-center">
      <div class="h-px bg-slate-100 w-16 mx-auto mb-6"></div>
      <p id="en-text" class="text-xl sm:text-2xl font-black text-blue-600 leading-snug break-keep px-2"></p>
      <p id="answer-note" class="text-[10px] text-slate-300 mt-4">모범 답안 · 먼저 직접 말해 보세요</p>
    </div>
    <div id="finish-ui" class="hidden absolute inset-0 bg-white z-50 flex flex-col items-center justify-center p-6 text-center rounded-[3rem]">
      <p class="text-4xl mb-4">🎉</p>
      <h2 class="text-2xl font-black mb-2 text-slate-800">연습 완료!</h2>
      <p id="finish-summary" class="text-sm text-slate-500 mb-5">드릴을 모두 마쳤습니다.</p>
      <div id="finish-banner-area" class="w-full"></div>
      <button id="cal-confirm-btn" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg mb-2">복습 알림 예약하기</button>
      <button onclick="location.reload()" class="text-slate-400 text-sm font-bold py-2">처음으로 돌아가기</button>
    </div>
  </div>

  <div id="study-banner-area"></div>
  <div id="control-panel" class="flex gap-2 mb-5 items-center">
    <button onclick="prevStep()" id="prev-btn" class="nav-control w-12 shrink-0 bg-white border border-slate-200 text-slate-500 rounded-2xl font-bold text-xl shadow-sm" aria-label="이전 문제" title="이전 문제">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
    </button>
    <button onclick="handleAction()" id="main-btn" class="nav-control flex-1 min-w-0 bg-slate-900 text-white rounded-2xl font-bold text-base shadow-lg active:scale-[.98] transition-transform">정답 확인</button>
    <button onclick="hideAnswer()" id="hide-answer-btn" class="nav-control hide-control is-unavailable bg-white border border-slate-200 text-slate-500 rounded-2xl font-bold text-xs" aria-label="정답 숨기기" aria-disabled="true" title="정답 숨기기">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18M10.6 10.6a2 2 0 002.8 2.8M9.9 5.2A10.7 10.7 0 0121 12a10.7 10.7 0 00-3.2 4.8"/></svg><span>숨기기</span>
    </button>
  </div>
  <div id="progress-container" class="h-4 flex items-center w-full mb-2"><div class="h-1.5 w-full bg-slate-200 rounded-full overflow-hidden pointer-events-none"><div id="progress-bar" class="h-full bg-orange-500 transition-all duration-300" style="width:0%"></div></div></div>
  <p id="progress-text" class="text-center text-slate-400 text-[9px] font-bold uppercase tracking-widest pb-6 pointer-events-none">Step 1 / 40</p>
</div>

<script>
const coreData = [
  {num:'01',kr:'너 아침 먹었어?',en:'Did you eat breakfast?'},
  {num:'02',kr:'너 커피 마셨어?',en:'Did you drink coffee?'},
  {num:'03',kr:'너 어제 일했어?',en:'Did you work yesterday?'},
  {num:'04',kr:'너 TV 봤어?',en:'Did you watch TV?'},
  {num:'05',kr:'너 음악 들었어?',en:'Did you listen to music?'},
  {num:'06',kr:'너 친구 만났어?',en:'Did you meet your friend?'},
  {num:'07',kr:'너 엄마한테 전화했어?',en:'Did you call your mom?'},
  {num:'08',kr:'너 설거지 했어?',en:'Did you wash the dishes?'},
  {num:'09',kr:'너 집에 갔어?',en:'Did you go home?'},
  {num:'10',kr:'너 운동했어?',en:'Did you exercise?'},
  {num:'11',kr:'너 영화 봤어?',en:'Did you watch a movie?'},
  {num:'12',kr:'너 영어 공부했어?',en:'Did you study English?'},
  {num:'13',kr:'너 일찍 일어났어?',en:'Did you get up early?'},
  {num:'14',kr:'너 샤워했어?',en:'Did you take a shower?'},
  {num:'15',kr:'너 쇼핑했어?',en:'Did you go shopping?'},
  {num:'16',kr:'너 저녁 요리했어?',en:'Did you cook dinner?'},
  {num:'17',kr:'너 문 잠갔어?',en:'Did you lock the door?'},
  {num:'18',kr:'너 사진 찍었어?',en:'Did you take a picture?'},
  {num:'19',kr:'너 숙제했어?',en:'Did you do your homework?'},
  {num:'20',kr:'너 물 마셨어?',en:'Did you drink water?'},
  {num:'21',kr:'너 어제 바빴어?',en:'Were you busy yesterday?'},
  {num:'22',kr:'너 피곤했어?',en:'Were you tired?'},
  {num:'23',kr:'너 배고팠어?',en:'Were you hungry?'},
  {num:'24',kr:'너 목말랐어?',en:'Were you thirsty?'},
  {num:'25',kr:'너 기분 안 좋았어?',en:'Were you upset?'},
  {num:'26',kr:'너 화났어?',en:'Were you angry?'},
  {num:'27',kr:'너 아팠어?',en:'Were you sick?'},
  {num:'28',kr:'너 졸렸어?',en:'Were you sleepy?'},
  {num:'29',kr:'너 긴장했어?',en:'Were you nervous?'},
  {num:'30',kr:'너 사무실에 있었어?',en:'Were you at the office?'},
  {num:'31',kr:'너 집에 있었어?',en:'Were you at home?'},
  {num:'32',kr:'너 회사에 있었어?',en:'Were you at work?'},
  {num:'33',kr:'너 학교에 있었어?',en:'Were you at school?'},
  {num:'34',kr:'너 혼자 있었어?',en:'Were you alone?'},
  {num:'35',kr:'너 강남에 있었어?',en:'Were you in 강남?'},
  {num:'36',kr:'너 성수에 있었어?',en:'Were you in 성수?'},
  {num:'37',kr:'너 어제 늦었어?',en:'Were you late yesterday?'},
  {num:'38',kr:'너 회의 중이었어?',en:'Were you in a meeting?'},
  {num:'39',kr:'너 밖에 있었어?',en:'Were you outside?'},
  {num:'40',kr:'너 화장실에 있었어?',en:'Were you in the washroom?'}
];

// 핵심 문장마다 주어를 바꾸고, 주어에 연결된 소유격도 일치시킨 응용 문장 2개씩 생성: 총 80개.
// Did you -> Did she/he/they, Were you -> Was she/he / Were they.
const subjectPairs = [
  [{en:'she',kr:'걔(여자)'},{en:'he',kr:'걔(남자)'}],
  [{en:'they',kr:'걔네들'},{en:'she',kr:'걔(여자)'}],
  [{en:'he',kr:'걔(남자)'},{en:'they',kr:'걔네들'}]
];
function makeApplied(core,index){
  const pair=subjectPairs[index%subjectPairs.length];
  return pair.map((s,j)=>{
    let en=core.en;
    let kr=core.kr;
    if(en.startsWith('Did you ')){
      en=en.replace(/^Did you /,`Did ${s.en} `);
      kr=kr.replace(/^너 /,`${s.kr} `);
    } else if(en.startsWith('Were you ')){
      const be=s.en==='they'?'Were':'Was';
      en=en.replace(/^Were you /,`${be} ${s.en} `);
      kr=kr.replace(/^너 /,`${s.kr} `);
    }
    // 소유격 your는 응용문장의 주어에 맞춰 her/his/their로 변경한다.
    if(/\byour\b/.test(en)){
      const possessive={she:'her',he:'his',they:'their'}[s.en];
      en=en.replace(/\byour\b/g,possessive);
      const subjectKr=s.en==='they'?'걔네들은':`${s.kr}는`;
      const possessiveKr=({ '06': '자기 친구 만났어?', '07': '자기 엄마한테 전화했어?', '19': '자기 숙제했어?',
                            '01': '자기 방 청소 안 했어?', '14': '자기 친구랑 이야기 안 했어?' })[core.num];
      if(possessiveKr) kr=subjectKr+' '+possessiveKr;
    }
    return {num:`${core.num}-${j+1}`,coreNum:core.num,coreKr:core.kr,coreEn:core.en,kr,en};
  });
}
const appliedData=coreData.flatMap((c,i)=>makeApplied(c,i));

let contentMode='core',orderMode='ordered',studySequence=[],currentIdx=0,isRevealed=false,isAutoMode=false,autoGaugeTimer=null;
const KR_THINK_TIME=5000,EN_CONFIRM_TIME=2500;
const bannerMsgs=[{icon:'🔥',text:'하루 1분 투자! 실전 패턴 Pop!'},{icon:'🎬',text:'미드 보면서 실전 영어 패턴도 Pop!'}];
let currentBannerIdx=0;

function injectBanners(){
  const t=document.getElementById('banner-template').content;
  ['setup-banner-area','study-banner-area','finish-banner-area'].forEach(id=>{
    const a=document.getElementById(id);if(a)a.appendChild(t.cloneNode(true));
  });
}
function rotateBanners(){
  currentBannerIdx=(currentBannerIdx+1)%bannerMsgs.length;
  const m=bannerMsgs[currentBannerIdx];
  document.querySelectorAll('.promo-banner').forEach(b=>{
    const i=b.querySelector('.banner-inner');if(!i)return;
    i.style.opacity=0;i.style.transform='translateY(3px)';
    setTimeout(()=>{
      b.querySelector('.banner-icon').innerText=m.icon;
      b.querySelector('.banner-title').innerText=m.text;
      i.style.opacity=1;i.style.transform='translateY(0)';
    },500);
  });
}
function selectContentMode(m){contentMode=m;updateSelections();}
function selectOrderMode(m){orderMode=m;updateSelections();}
function updateSelections(){
  [['core','tab-core',contentMode],['applied','tab-applied',contentMode],['ordered','tab-ordered',orderMode],['random','tab-random',orderMode]].forEach(([value,id,selected])=>{
    document.getElementById(id).className=value===selected
      ?'py-3 rounded-xl font-black text-xs transition-all mode-btn-active shadow-sm'
      :'py-3 rounded-xl font-bold text-xs text-slate-500 transition-all';
  });
  const count=contentMode==='core'?40:80;
  document.getElementById('mode-desc').innerText=`${contentMode==='core'?'핵심 문장 40개':'응용 문장 80개'}를 ${orderMode==='ordered'?'순서대로':'중복 없이 랜덤으로'} 연습합니다.`;
}
function toggleAutoMode(){
  isAutoMode=!isAutoMode;
  const b=document.getElementById('auto-mode-btn');
  b.innerHTML=isAutoMode?'🟠 자동 재생 ON':'⚪ 자동 재생 OFF';
  b.className=`w-full py-4 rounded-2xl border-2 font-bold flex items-center justify-center gap-2 transition-all ${isAutoMode?'auto-active':'border-slate-100 text-slate-600'}`;
}
function switchModeInGame(){
  isAutoMode=!isAutoMode;updateInGameModeUI();
  if(isAutoMode)runAutoGauge(isRevealed?EN_CONFIRM_TIME:KR_THINK_TIME);else stopAutoGauge();
}
function updateInGameModeUI(){
  const s=document.getElementById('mode-status'),b=document.getElementById('mode-switch-btn');
  s.innerText=isAutoMode?'자동':'수동';
  s.className=isAutoMode?'text-[9px] font-black px-2 py-0.5 rounded-full bg-orange-100 text-orange-600':'text-[9px] font-black px-2 py-0.5 rounded-full bg-slate-50 text-slate-300';
  b.innerText=isAutoMode?'수동 전환':'자동 전환';
}
function runAutoGauge(duration){
  stopAutoGauge();if(!isAutoMode)return;
  const c=document.getElementById('timer-gauge-container'),bar=document.getElementById('timer-gauge-bar');
  c.classList.remove('hidden');bar.style.transition='none';bar.style.width='100%';
  const start=Date.now();
  requestAnimationFrame(()=>bar.style.transition='width 50ms linear');
  autoGaugeTimer=setInterval(()=>{
    const left=Math.max(0,duration-(Date.now()-start));
    bar.style.width=`${left/duration*100}%`;
    if(left<=0){stopAutoGauge();handleAction();}
  },50);
}
function stopAutoGauge(){
  if(autoGaugeTimer){clearInterval(autoGaugeTimer);autoGaugeTimer=null;}
  const c=document.getElementById('timer-gauge-container'),b=document.getElementById('timer-gauge-bar');
  if(c)c.classList.add('hidden');if(b)b.style.width='100%';
}
function shuffleArray(a){
  const c=[...a];for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];}return c;
}
function startStudy(){
  const source=contentMode==='core'?coreData:appliedData;
  studySequence=orderMode==='random'?shuffleArray(source):[...source];
  currentIdx=0;
  document.getElementById('badge-playmode').innerText=`${contentMode==='core'?'핵심':'응용'} · ${orderMode==='ordered'?'순서':'랜덤'}`;
  document.getElementById('setup-screen').classList.add('hidden');
  document.getElementById('study-screen').classList.remove('hidden');
  initProgressControl();updateInGameModeUI();render();
}
function render(){
  stopAutoGauge();
  const item=studySequence[currentIdx],pb=document.getElementById('prev-item-box');
  if(currentIdx>0){
    const p=studySequence[currentIdx-1];
    document.getElementById('prev-kr').innerText='직전: '+p.kr;
    document.getElementById('prev-en').innerText=contentMode==='applied'?p.en:'';
    document.getElementById('prev-en').classList.toggle('hidden',contentMode==='core');
    pb.classList.remove('opacity-0');pb.classList.add('opacity-40');
  }else{
    pb.classList.add('opacity-0');pb.classList.remove('opacity-40');
    document.getElementById('prev-en').classList.toggle('hidden',contentMode==='core');
  }
  document.getElementById('sentence-number').innerText=`${item.num} · ${currentIdx+1}/${studySequence.length}`;
  const coreRef=document.getElementById('core-reference');
  if(contentMode==='core'){coreRef.classList.add('hidden');}
  else{coreRef.classList.remove('hidden');coreRef.innerText=`핵심 문장 ${item.coreNum}: ${item.coreEn}`;}
  document.getElementById('kr-box').innerText=item.kr;
  document.getElementById('en-text').innerText=item.en;
  document.getElementById('answer-note').classList.toggle('hidden',contentMode==='core');
  document.getElementById('progress-text').innerText=`Step ${currentIdx+1} / ${studySequence.length}`;
  document.getElementById('progress-bar').style.width=`${studySequence.length<=1?100:currentIdx/(studySequence.length-1)*100}%`;
  document.getElementById('en-box').className='answer-hidden transition-all duration-500 w-full text-center';
  document.getElementById('main-btn').innerText='정답 확인';
  setHideButtonState(false);isRevealed=false;
  const prev=document.getElementById('prev-btn');
  prev.classList.toggle('text-slate-300',currentIdx===0);
  prev.classList.toggle('text-slate-500',currentIdx>0);
  prev.classList.toggle('opacity-40',currentIdx===0);
  prev.classList.toggle('pointer-events-none',currentIdx===0);
  if(isAutoMode)runAutoGauge(KR_THINK_TIME);
}
function handleAction(){
  stopAutoGauge();
  if(!isRevealed){
    document.getElementById('en-box').className='answer-visible transition-all duration-500 w-full text-center';
    document.getElementById('main-btn').innerText='다음 문제';
    setHideButtonState(true);isRevealed=true;
    if(isAutoMode)runAutoGauge(EN_CONFIRM_TIME);
  }else{
    currentIdx++;
    if(currentIdx<studySequence.length)render();else finishStudy();
  }
}
function setHideButtonState(available){
  const b=document.getElementById('hide-answer-btn');
  b.classList.toggle('is-available',available);b.classList.toggle('is-unavailable',!available);
  b.setAttribute('aria-disabled',String(!available));
}
function hideAnswer(){
  if(!isRevealed)return;
  stopAutoGauge();
  document.getElementById('en-box').className='answer-hidden transition-all duration-500 w-full text-center';
  document.getElementById('main-btn').innerText='정답 확인';
  setHideButtonState(false);isRevealed=false;
  if(isAutoMode)runAutoGauge(KR_THINK_TIME);
}
function prevStep(){if(currentIdx>0){currentIdx--;render();}}
function initProgressControl(){
  const c=document.getElementById('progress-container');
  const seek=e=>{
    const r=c.getBoundingClientRect(),x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
    const p=Math.max(0,Math.min(1,x/r.width)),n=Math.round(p*(studySequence.length-1));
    if(n!==currentIdx){currentIdx=n;render();}
  };
  c.onmousedown=e=>{
    seek(e);const move=m=>seek(m),up=()=>{
      document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);
    };
    document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);
  };
  c.ontouchstart=e=>{
    seek(e);const move=m=>{m.preventDefault();seek(m);},up=()=>{
      document.removeEventListener('touchmove',move);document.removeEventListener('touchend',up);
    };
    document.addEventListener('touchmove',move,{passive:false});document.addEventListener('touchend',up);
  };
}
function finishStudy(){
  stopAutoGauge();
  document.getElementById('finish-ui').classList.remove('hidden');
  document.getElementById('prev-item-box').classList.add('hidden');
  document.getElementById('study-banner-area').style.display='none';
  document.getElementById('control-panel').style.display='none';
  document.getElementById('finish-summary').innerText=`${studySequence.length}개 드릴을 모두 마쳤습니다. 수고하셨습니다!`;
  document.getElementById('cal-confirm-btn').onclick=()=>{
    const days=prompt('며칠 뒤에 복습 알림을 예약할까요? (1~30)','1');
    if(!days)return;
    const n=Math.max(1,Math.min(30,parseInt(days)||1)),d=new Date();d.setDate(d.getDate()+n);
    const date=d.toISOString().replace(/-|:|\.\d+/g,'').slice(0,8);
    const title=encodeURIComponent(`[복습] Past 1강 2교시 Question Drill (${contentMode==='core'?'핵심':'응용'} · ${orderMode==='ordered'?'순서':'랜덤'} 모드)`);
    const details=encodeURIComponent(`Past 1강 2교시 과거시제 의문문 드릴 복습하기!\n\n🔗 주소: ${location.href}`);
    location.href=`https://www.google.com/calendar/render?action=TEMPLATE&text=${title}&details=${details}&dates=${date}T090000/${date}T100000`;
  };
}
window.onload=()=>{injectBanners();setInterval(rotateBanners,4000);};
</script>
</body>
