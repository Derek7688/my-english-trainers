<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ Delta Lite Up Next! - 3강 Practice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;900&display=swap');
        * {
            box-sizing: border-box;
            word-break: keep-all;
            overflow-wrap: break-word;
        }
        body { font-family: 'Pretendard', sans-serif; touch-action: manipulation; }
        .auto-active { background-color: #f97316 !important; color: white !important; border-color: #f97316 !important; }
        
        .card-container { min-height: 420px; display: flex; flex-direction: column; justify-content: space-between; }
        .banner-inner { transition: all 0.5s ease; }
        #progress-container { cursor: pointer; touch-action: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-start p-4">

    <!-- 배너 템플릿 -->
    <template id="banner-template">
        <div class="promo-banner bg-white border border-blue-50 p-4 rounded-[2.2rem] mb-6 cursor-pointer shadow-lg transition-all active:scale-95 w-full max-w-sm mx-auto" 
             onclick="window.open('https://www.pse-learning.co.kr/course/course_list.jsp?cid=120849', '_blank')">
            <div class="banner-inner flex items-center gap-4">
                <div class="banner-icon w-10 h-10 bg-blue-600 rounded-2xl flex items-center justify-center text-xl shadow-blue-200 shadow-lg text-white font-bold">🔥</div>
                <div class="flex-1 overflow-hidden h-10 flex flex-col justify-center text-left">
                    <h3 class="banner-title font-black text-slate-800 text-[14px] tracking-tight leading-tight">하루 1분 투자! 실전 패턴 Pop!</h3>
                    <p class="text-blue-600 font-bold text-[9px] uppercase tracking-widest mt-0.5">수강 신청하고 영어 실력 Pop! →</p>
                </div>
            </div>
        </div>
    </template>

    <!-- [1] 설정 화면 -->
    <div id="setup-screen" class="bg-white p-8 rounded-[2.5rem] shadow-2xl max-w-sm w-full border border-slate-100 my-auto text-center">
        <span class="bg-indigo-100 text-indigo-600 px-4 py-1 rounded-full text-xs font-bold mb-3 inline-block uppercase tracking-widest">Delta Lite Up Next!</span>
        <h1 class="text-3xl font-black text-slate-800 mb-2">3강 Practice</h1>
        <p class="text-indigo-600 font-bold text-base italic mb-6">현재 진행형의 미래 50문항 응용 트레이닝</p>
        
        <div id="setup-banner-area"></div>

        <div class="mb-8">
            <button id="auto-mode-btn" onclick="toggleAutoMode()" class="w-full py-4 rounded-2xl border-2 border-slate-100 font-bold text-slate-600 flex items-center justify-center gap-2 transition-all hover:bg-slate-50">
                <span id="auto-icon">⚪</span> 자동 재생 OFF
            </button>
        </div>
        <button onclick="startApp()" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-bold text-lg shadow-xl active:scale-95 transition-all">훈련 시작하기 🚀</button>
    </div>

    <!-- [2] 학습 화면 -->
    <div id="appScreen" class="hidden w-full max-w-lg text-slate-900 mx-auto">
        
        <!-- 상단 헤더 -->
        <div class="flex justify-between items-center mb-4 px-2">
            <button onclick="location.reload()" class="p-2 hover:bg-slate-200 rounded-full transition-colors text-slate-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 001 1v4a1 1 0 001 1m-6 0h6" /></svg>
            </button>
            <div id="mainProgress" class="text-slate-400 font-black text-xs tracking-widest uppercase text-center flex-1">1 / 50</div>
            <div class="w-10"></div>
        </div>

        <!-- 메인 학습 카드 -->
        <div class="bg-white p-8 rounded-[3rem] shadow-2xl card-container text-center mb-6 border border-slate-50 relative overflow-hidden">
            
            <!-- 상단 모드 전환 헤더 -->
            <div class="flex justify-between items-center w-full mb-2">
                <span class="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-lg text-[10px] font-black uppercase tracking-tight">🔥 3강 응용 문장 조합</span>
                <div class="flex items-center gap-2">
                    <button onclick="switchModeInGame()" id="mode-switch-btn" class="text-slate-300 font-bold text-[10px] underline decoration-slate-100 hover:text-indigo-500 transition-colors">자동 모드 전환</button>
                    <div id="mode-status" class="text-[9px] font-black px-2 py-0.5 rounded-full bg-slate-50 text-slate-300 uppercase tracking-tighter transition-all">수동</div>
                </div>
            </div>

            <!-- 문제 한글 영역 -->
            <div class="my-auto py-4 min-h-[120px] flex flex-col justify-center">
                <div class="text-xs font-black text-indigo-500 uppercase tracking-wider mb-2">Q. 다음 문장을 영어로 말해보세요</div>
                <div id="questionKor" class="text-2xl font-bold text-slate-800 leading-relaxed px-2">문장 불러오는 중...</div>
            </div>

            <!-- 정답 결과 표시 영역 -->
            <div id="ansBox" class="w-full bg-slate-50 border border-slate-100 rounded-2xl p-5 min-h-[90px] flex flex-col items-center justify-center transition-all">
                <div id="ansEng" class="invisible opacity-0 text-xl font-black text-indigo-600 leading-snug transition-all duration-300"></div>
            </div>

            <!-- 완독 모달 영역 -->
            <div id="finish-ui" class="hidden absolute inset-0 bg-white z-50 flex flex-col items-center justify-center p-6 text-center rounded-[3rem]">
                <p class="text-5xl mb-3 animate-bounce">🏆</p>
                <h2 class="text-2xl font-black mb-2 text-slate-800">50문항 완독 완료! 🎉</h2>
                <div id="finish-banner-area" class="w-full"></div>
                <button onclick="restartWithShuffle()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg mb-2">🔄 다시 셔플해서 도전하기</button>
                <button onclick="location.reload()" class="text-slate-400 text-sm font-bold py-2">처음으로 돌아가기</button>
            </div>
        </div>

        <div id="study-banner-area"></div>

        <!-- 하단 컨트롤 패널 -->
        <div id="control-panel" class="flex gap-2 mb-6">
            <button onclick="prevQuestion()" id="prev-btn" class="w-16 bg-white border-2 border-slate-100 text-slate-300 py-5 rounded-[1.8rem] font-black text-xl active:scale-95 transition-all flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7" /></svg>
            </button>
            <button onclick="handleAction()" id="main-btn" class="flex-1 bg-slate-900 text-white py-5 rounded-[1.8rem] font-black text-lg shadow-2xl active:scale-95 transition-all">정답 확인</button>
            <button onclick="nextQuestionDirect()" id="next-btn" class="w-16 bg-indigo-600 text-white py-5 rounded-[1.8rem] font-black text-xl active:scale-95 transition-all flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7" /></svg>
            </button>
        </div>

        <!-- 드래그 탐색 진행 바 -->
        <div id="progress-container" class="h-4 flex items-center w-full mb-2">
            <div class="h-1.5 w-full bg-slate-200 rounded-full overflow-hidden pointer-events-none">
                <div id="progress-bar" class="h-full bg-orange-500 transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>
        <p id="progress-text" class="text-center text-slate-400 text-[9px] font-bold uppercase tracking-widest pb-6 pointer-events-none">Step 1 / 50</p>
    </div>

    <script>
        const masterQuestions = [
            // 1. pick up 사람 (from school / at the station / at the airport)
            { kor: "나 내일 공항에 친구 데리러 가.", eng: "I’m picking up my friend at the airport tomorrow." },
            { kor: "너 이따가 학교로 걔네들 데리러 가?", eng: "Are you picking them up from school later?" },
            { kor: "난 3시에 광명역으로 걔(남자) 데리러 가.", eng: "I’m picking him up at 광명 station at 3." },
            { kor: "너 내일 공항에 걔(여자) 데리러 안 가?", eng: "Aren’t you picking her up at the airport tomorrow?" },
            { kor: "걔(남자)는 곧 학교로 아이들 데리러 가.", eng: "He is picking up the kids from school soon." },
            { kor: "걔(여자)가 역으로 너 데리러 가?", eng: "Is she picking you up at the station?" },
            { kor: "우린 내일 공항으로 친구들 데리러 가.", eng: "We’re picking up our friends at the airport tomorrow." },
            { kor: "네가 광명역으로 걔(남자) 데리러 가?", eng: "Are you picking him up at 광명 station?" },
            { kor: "걔네들이 공항으로 너 데리러 가?", eng: "Are they picking you up at the airport?" },
            { kor: "나 이따가 학교에 걔(여자) 데리러 가.", eng: "I’m picking her up from school later." },

            // 2. visit 명사 (this weekend / my friend / in the hospital)
            { kor: "우린 이번 주말에 할아버지 댁에 가.", eng: "We’re visiting my grandparents this weekend." },
            { kor: "너 내일 걔(여자) 병문안 가?", eng: "Are you visiting her in the hospital tomorrow?" },
            { kor: "나 점심 먹고 친구 집에 가.", eng: "I’m visiting my friend after lunch." },
            { kor: "너 이번 주말에 할아버지 댁 안 가?", eng: "Aren’t you visiting your grandparents this weekend?" },
            { kor: "걔(남자)는 내일 내 병문안 안 와.", eng: "He isn’t visiting me in the hospital tomorrow." },
            { kor: "걔(여자) 이번 주말에 친구 집에 간대?", eng: "Is she visiting her friend this weekend?" },
            { kor: "나 내일 할아버지 댁에 가.", eng: "I’m visiting my grandparents tomorrow." },
            { kor: "너 이따가 걔(남자) 병문안 가?", eng: "Are you visiting him in the hospital later?" },
            { kor: "너 점심 먹고 친구 집에 가지 않아?", eng: "Aren’t you visiting your friend after lunch?" },
            { kor: "우린 이번 주말에 친구 집에 갈 거야.", eng: "We’re visiting our friend this weekend." },

            // 3. hang out (with 사람 / near 장소 / in 지역)
            { kor: "나 이번 주 금요일에 친구들이랑 놀아.", eng: "I’m hanging out with my friends this Friday." },
            { kor: "너 오늘 이 근처에서 놀아?", eng: "Are you hanging out near here today?" },
            { kor: "우린 이번 주말에 성수에서 놀아.", eng: "We’re hanging out in 성수 this weekend." },
            { kor: "너 이번 주 금요일에 친구들이랑 안 놀아?", eng: "Aren’t you hanging out with your friends this Friday?" },
            { kor: "걔(남자)는 저녁 먹고 성수에서 놀 거래.", eng: "He is hanging out in 성수 after dinner." },
            { kor: "걔(여자) 오늘 이 근처에서 논대?", eng: "Is she hanging out near here today?" },
            { kor: "나 내일 성수에서 친구들이랑 놀아.", eng: "I’m hanging out with my friends in 성수 tomorrow." },
            { kor: "너 이번 주말에 이 근처에서 놀아?", eng: "Are you hanging out near here this weekend?" },
            { kor: "걔네들 이번 주 금요일에 성수에서 안 논대?", eng: "Aren’t they hanging out in 성수 this Friday?" },
            { kor: "우린 오늘 밤에 이 근처에서 놀아.", eng: "We’re hanging out near here tonight." },

            // 4. attend 명사 (a wedding / a funeral / a workshop)
            { kor: "나 내일 결혼식 가.", eng: "I’m attending a wedding tomorrow." },
            { kor: "너 오늘 밤에 장례식 가?", eng: "Are you attending the funeral tonight?" },
            { kor: "나 이번 주말에 워크숍 가.", eng: "I’m attending a workshop this weekend." },
            { kor: "너 내일 결혼식 안 가?", eng: "Aren’t you attending the wedding tomorrow?" },
            { kor: "걔(남자)는 이번 주말에 워크숍 안 가.", eng: "He isn’t attending the workshop this weekend." },
            { kor: "걔(여자) 오늘 밤에 장례식 간대?", eng: "Is she attending the funeral tonight?" },
            { kor: "우린 이번 주말에 결혼식 가.", eng: "We’re attending a wedding this weekend." },
            { kor: "너 내일 워크숍 가?", eng: "Are you attending the workshop tomorrow?" },
            { kor: "걔네들 오늘 밤에 장례식 안 간대?", eng: "Aren’t they attending the funeral tonight?" },
            { kor: "나 내일 친구 결혼식 가.", eng: "I’m attending my friend’s wedding tomorrow." },

            // 5. start (soon / tomorrow morning / after 5)
            { kor: "곧 시작해.", eng: "It’s starting soon." },
            { kor: "내일 아침에 시작해?", eng: "Is it starting tomorrow morning?" },
            { kor: "내일 5시 넘어서 시작해.", eng: "It’s starting after 5 tomorrow." },
            { kor: "곧 시작 안 해?", eng: "Isn’t it starting soon?" },
            { kor: "내일 아침에 시작 안 한대.", eng: "It isn’t starting tomorrow morning." },
            { kor: "5시 넘어서 시작해?", eng: "Is it starting after 5?" },
            { kor: "오늘 밤에 시작해.", eng: "It’s starting tonight." },
            { kor: "내일 5시 넘어서 시작하지 않아?", eng: "Isn’t it starting after 5 tomorrow?" },
            { kor: "워크숍 내일 시작해.", eng: "The workshop is starting tomorrow." },
            { kor: "결혼식 곧 시작해.", eng: "The wedding is starting soon." }
        ];

        let activeQuestions = [];
        let currentIdx = 0;
        let isAnswerRevealed = false;
        let isAutoMode = false;
        let autoTimer = null;

        const bannerMsgs = [
            { icon: "🔥", text: "하루 1분 투자! 실전 패턴 Pop!" },
            { icon: "🎬", text: "미드 보면서 실전 영어 패턴도 Pop!" }
        ];
        let currentBannerIdx = 0;

        function injectBanners() {
            const template = document.getElementById('banner-template').content;
            ['setup-banner-area', 'study-banner-area', 'finish-banner-area'].forEach(id => {
                const area = document.getElementById(id);
                if (area) area.appendChild(template.cloneNode(true));
            });
        }

        function rotateBanners() {
            currentBannerIdx = (currentBannerIdx + 1) % bannerMsgs.length;
            const msg = bannerMsgs[currentBannerIdx];
            document.querySelectorAll('.promo-banner').forEach(banner => {
                const inner = banner.querySelector('.banner-inner');
                if(!inner) return;
                inner.style.opacity = 0;
                inner.style.transform = "translateY(3px)";
                setTimeout(() => {
                    banner.querySelector('.banner-icon').innerText = msg.icon;
                    banner.querySelector('.banner-title').innerText = msg.text;
                    inner.style.opacity = 1;
                    inner.style.transform = "translateY(0)";
                }, 500);
            });
        }

        function toggleAutoMode() {
            isAutoMode = !isAutoMode;
            const btn = document.getElementById('auto-mode-btn');
            btn.innerHTML = isAutoMode ? `<span>🟠</span> 자동 재생 ON` : `<span>⚪</span> 자동 재생 OFF`;
            btn.className = `w-full py-4 rounded-2xl border-2 font-bold flex items-center justify-center gap-2 transition-all ${isAutoMode ? 'auto-active' : 'border-slate-100 text-slate-600'}`;
        }

        function switchModeInGame() {
            isAutoMode = !isAutoMode;
            updateInGameModeUI();
            if(isAutoMode) handleAction(); else clearTimeout(autoTimer);
        }

        function updateInGameModeUI() {
            const status = document.getElementById('mode-status');
            const switchBtn = document.getElementById('mode-switch-btn');
            if(isAutoMode) {
                status.innerText = "자동";
                status.className = "text-[9px] font-black px-2 py-0.5 rounded-full bg-orange-100 text-orange-600 uppercase tracking-tighter";
                switchBtn.innerText = "수동 전환";
            } else {
                status.innerText = "수동";
                status.className = "text-[9px] font-black px-2 py-0.5 rounded-full bg-slate-50 text-slate-300 uppercase tracking-tighter";
                switchBtn.innerText = "자동 전환";
            }
        }

        function startApp() {
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('appScreen').classList.remove('hidden');
            
            shuffleQuestions();
            currentIdx = 0;
            initProgressControl();
            updateInGameModeUI();
            loadQuestion();
        }

        function shuffleQuestions() {
            activeQuestions = [...masterQuestions];
            for (let i = activeQuestions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [activeQuestions[i], activeQuestions[j]] = [activeQuestions[j], activeQuestions[i]];
            }
        }

        function loadQuestion() {
            clearTimeout(autoTimer);
            document.getElementById('mainProgress').innerText = `${currentIdx + 1} / ${activeQuestions.length}`;
            document.getElementById('progress-text').innerText = `Step ${currentIdx + 1} / ${activeQuestions.length}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx) / (activeQuestions.length - 1)) * 100}%`;

            const item = activeQuestions[currentIdx];
            document.getElementById('questionKor').innerText = item.kor;
            
            const ansEng = document.getElementById('ansEng');
            ansEng.innerText = item.eng;
            ansEng.classList.add('invisible', 'opacity-0');
            
            isAnswerRevealed = false;
            document.getElementById('main-btn').innerText = "정답 확인";

            const prevBtn = document.getElementById('prev-btn');
            if (currentIdx > 0) {
                prevBtn.classList.remove('text-slate-300', 'pointer-events-none');
                prevBtn.classList.add('text-slate-600');
            } else {
                prevBtn.classList.add('text-slate-300', 'pointer-events-none');
                prevBtn.classList.remove('text-slate-600');
            }

            if(isAutoMode) autoTimer = setTimeout(handleAction, 4500);
        }

        function handleAction() {
            clearTimeout(autoTimer);
            if (!isAnswerRevealed) {
                isAnswerRevealed = true;
                const ansEng = document.getElementById('ansEng');
                ansEng.classList.remove('invisible', 'opacity-0');
                document.getElementById('main-btn').innerText = "다음 문제";
                if(isAutoMode) autoTimer = setTimeout(handleAction, 3000);
            } else {
                currentIdx++;
                if (currentIdx < activeQuestions.length) loadQuestion();
                else showEndingModal();
            }
        }

        function nextQuestionDirect() {
            clearTimeout(autoTimer);
            currentIdx++;
            if (currentIdx < activeQuestions.length) loadQuestion();
            else showEndingModal();
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                clearTimeout(autoTimer);
                currentIdx--;
                loadQuestion();
            }
        }

        function initProgressControl() {
            const container = document.getElementById('progress-container');
            const seek = (e) => {
                const rect = container.getBoundingClientRect();
                const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
                let percent = x / rect.width;
                percent = Math.max(0, Math.min(1, percent));
                const newIdx = Math.round(percent * (activeQuestions.length - 1));
                if (newIdx !== currentIdx) {
                    currentIdx = newIdx;
                    loadQuestion();
                }
            };
            container.addEventListener('mousedown', (e) => {
                seek(e);
                const onMouseMove = (moveEvent) => seek(moveEvent);
                const onMouseUp = () => {
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                };
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });
            container.addEventListener('touchstart', (e) => {
                seek(e);
                const onTouchMove = (moveEvent) => {
                    moveEvent.preventDefault();
                    seek(moveEvent);
                };
                const onTouchEnd = () => {
                    document.removeEventListener('touchmove', onTouchMove);
                    document.removeEventListener('touchend', onTouchEnd);
                };
                document.addEventListener('touchmove', onTouchMove, { passive: false });
                document.addEventListener('touchend', onTouchEnd);
            });
        }

        function showEndingModal() {
            clearTimeout(autoTimer);
            document.getElementById('finish-ui').classList.remove('hidden');
            document.getElementById('control-panel').style.display = 'none';
            document.getElementById('study-banner-area').style.display = 'none';
        }

        function restartWithShuffle() {
            document.getElementById('finish-ui').classList.add('hidden');
            document.getElementById('control-panel').style.display = 'flex';
            document.getElementById('study-banner-area').style.display = 'block';
            shuffleQuestions();
            currentIdx = 0;
            loadQuestion();
        }

        window.onload = () => {
            injectBanners();
            setInterval(rotateBanners, 4000);
        };
    </script>
</body>
</html>
